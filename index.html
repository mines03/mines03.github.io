<!DOCTYPE html>
<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    /* ================= RESET & BASE ================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.7;
      color: #2c3e50;
      background-color: #fafafa;
      padding: 20px;
      max-width: 850px;
      margin: 0 auto;
    }
    
    a {
      color: #2563eb;
      text-decoration: none;
      transition: color 0.2s;
    }
    
    a:hover {
      color: #1d4ed8;
      text-decoration: underline;
    }

    header {
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 1rem;
      margin-bottom: 2rem;
    }
    
    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
    }
    
    header h1 a {
      color: #1f2937;
    }
    
    header h1 a:hover {
      text-decoration: none;
      color: #2563eb;
    }
    
    /* ================= LOADING ================= */
    #loading {
      text-align: center;
      color: #6b7280;
      padding: 2rem;
      font-style: italic;
    }

      background: white;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
